services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mini_twitter
      POSTGRES_PASSWORD: mini_twitter
      POSTGRES_DB: mini_twitter_development
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_twitter"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    command: bin/rails server -b 0.0.0.0 -p 3001
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: mini_twitter
      DATABASE_PASSWORD: mini_twitter
      DATABASE_NAME: mini_twitter_development
      TEST_DATABASE_NAME: mini_twitter_test
      CORS_ORIGINS: http://localhost:5173
      RAILS_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./api:/app
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - webmodules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  bundle:
  webmodules:
