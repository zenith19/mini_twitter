name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (Rails ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.2.3"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mini_twitter
          POSTGRES_PASSWORD: mini_twitter
          POSTGRES_DB: mini_twitter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mini_twitter"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: mini_twitter
      DATABASE_PASSWORD: mini_twitter
      TEST_DATABASE_NAME: mini_twitter_test

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: api
      - name: Prepare the database
        working-directory: api
        run: bin/rails db:prepare
      - name: Run the test suite
        working-directory: api
        run: bin/rails test

  web:
    name: web (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: Run the test suite
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build
